name: CI

on:
  pull_request:
  push:
    branches: [main]

# Zero AWS/Anthropic/Supabase access needed — `npm run smoke` runs in mock
# mode automatically whenever ANTHROPIC_API_KEY is unset (apps/server/src/
# llm/client.ts: isMockMode), which is exactly the point: this workflow
# validates pipeline logic on every PR with no secrets to configure.
jobs:
  build-typecheck-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run typecheck

      - run: npm run smoke -w @ops-master/server
